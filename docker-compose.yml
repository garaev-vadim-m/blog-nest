services:
  blogs:
    build: ./
    container_name: blogs_api
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: blog_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: blog_db
    ports:
      - '3306:3306'
